name: Promote develop to v2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without pushing (dry run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: promote-v2
  cancel-in-progress: false

jobs:
  promote:
    name: Hard-reset v2 to develop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: develop

      - name: Log delta
        run: |
          git fetch origin v2
          echo "=== Commits on develop not in v2 ==="
          git log --oneline origin/v2..origin/develop
          echo "=== Commits on v2 not in develop (will be dropped) ==="
          git log --oneline origin/develop..origin/v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # ── Phase 1: Build & commit develop dist (version: X.Y.Z-develop.<sha>) ──

      - name: Rebuild dist for develop
        run: bun run package
        env:
          GITHUB_REF_NAME: develop
          GITHUB_SHA: ${{ github.sha }}

      - name: Commit develop dist
        id: develop_dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if git diff --cached --exit-code -- dist/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git reset -- dist/ > /dev/null 2>&1 || true
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit --no-verify -m "chore: rebuild dist [skip ci]"
          fi

      - name: Push dist commit to develop
        if: inputs.dry_run != 'true' && steps.develop_dist.outputs.changed == 'true'
        run: git push origin develop

      # ── Phase 2: Force-push v2 (same tree, rebuild dist with clean semver) ──

      - name: Rebuild dist for v2
        run: bun run package
        env:
          GITHUB_REF_NAME: v2
          GITHUB_SHA: ${{ github.sha }}

      - name: Commit v2 dist
        id: v2_dist
        run: |
          git add -f dist/
          if git diff --cached --exit-code -- dist/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git reset -- dist/ > /dev/null 2>&1 || true
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit --no-verify -m "chore: rebuild dist [skip ci]"
          fi

      - name: Dry run - skip push
        if: inputs.dry_run == 'true'
        run: |
          echo "::notice::Dry run enabled - changes will NOT be pushed"
          echo "v2 would be force-pushed to: $(git rev-parse HEAD)"

      - name: Force-push v2
        if: inputs.dry_run != 'true'
        run: git push --force-with-lease origin HEAD:refs/heads/v2

      - name: Trigger release workflow
        if: inputs.dry_run != 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'v2',
            });
